<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daivik Reddy - Project Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .profile-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #667eea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .profile-info h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .profile-info p {
            color: #666;
            font-size: 1.1em;
            margin: 5px 0;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filters {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: all 0.3s;
        }

        .search-box:focus {
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        .filter-btn {
            padding: 12px 25px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .project-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .project-title {
            font-size: 1.3em;
            color: #333;
            font-weight: bold;
            flex: 1;
        }

        .project-stars {
            background: #ffd700;
            color: #333;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .project-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
            min-height: 60px;
        }

        .project-tech {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tech-badge {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            color: #667eea;
            font-weight: 600;
        }

        .project-links {
            display: flex;
            gap: 10px;
        }

        .project-link {
            flex: 1;
            padding: 10px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .project-link:hover {
            background: #667eea;
            color: white;
        }

        .project-date {
            color: #999;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        @media (max-width: 768px) {
            .profile-info h1 {
                font-size: 1.8em;
            }
            
            .projects-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="profile-section">
                <img src="https://avatars.githubusercontent.com/u/220503537?v=4" alt="Daivik Reddy" class="profile-img">
                <div class="profile-info">
                    <h1>DAIVIK REDDY</h1>
                    <p>🎓 11th Grade Student | AI/ML Enthusiast | SAM Founder</p>
                    <p>📍 Hyderabad, India | 🏫 JNV Ranga Reddy</p>
                </div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number">16</div>
                    <div class="stat-label">Projects</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">29</div>
                    <div class="stat-label">Stars</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">3</div>
                    <div class="stat-label">Followers</div>
                </div>
            </div>
        </header>

        <div class="filters">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search projects...">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="Python">Python</button>
            <button class="filter-btn" data-filter="JavaScript">JavaScript</button>
            <button class="filter-btn" data-filter="TypeScript">TypeScript</button>
            <button class="filter-btn" data-filter="AI/ML">AI/ML</button>
        </div>

        <div class="projects-grid" id="projectsGrid"></div>
    </div>

    <script>
        const projects = [
            {
                name: "3D Profile",
                description: "Interactive 3D portfolio showcasing my work and skills with modern web technologies",
                language: "JavaScript",
                stars: 0,
                url: "https://github.com/Daivik1520/profile",
                updated: "Dec 2025",
                category: "AI/ML"
            },
            {
                name: "YouTube Finder",
                description: "Smart YouTube content discovery tool with advanced search capabilities",
                language: "TypeScript",
                stars: 1,
                url: "https://github.com/Daivik1520/youtube-finder",
                updated: "Nov 2025",
                category: "Web"
            },
            {
                name: "Face Swapping",
                description: "Advanced face swapping application using deep learning and computer vision",
                language: "Python",
                stars: 3,
                url: "https://github.com/Daivik1520/face-swapping",
                updated: "Nov 2025",
                category: "AI/ML"
            },
            {
                name: "SAM v3",
                description: "Third generation of SAM - Advanced AI desktop assistant with voice control",
                language: "Python",
                stars: 2,
                url: "https://github.com/Daivik1520/SAM-v3",
                updated: "Nov 2025",
                category: "AI/ML"
            },
            {
                name: "SAM v2",
                description: "Voice-controlled Windows assistant with system controls, UI, and AI chat capabilities",
                language: "Python",
                stars: 2,
                url: "https://github.com/Daivik1520/SAM-v2",
                updated: "Nov 2025",
                category: "AI/ML"
            },
            {
                name: "Gesture Driver",
                description: "AI-powered computer control using hand gestures - navigate, game, and interact hands-free",
                language: "Python",
                stars: 3,
                url: "https://github.com/Daivik1520/gesture-driver",
                updated: "Nov 2025",
                category: "AI/ML"
            },
            {
                name: "Gesture-Based Gaming",
                description: "Innovative gaming control system using hand gestures and computer vision",
                language: "Python",
                stars: 2,
                url: "https://github.com/Daivik1520/gesture-based-gaming",
                updated: "Nov 2025",
                category: "AI/ML"
            },
            {
                name: "Typing Speed Test",
                description: "Interactive typing speed test application with real-time WPM calculation",
                language: "JavaScript",
                stars: 2,
                url: "https://github.com/Daivik1520/typing-speed-",
                updated: "Nov 2025",
                category: "Web"
            },
            {
                name: "SAMgpt",
                description: "Customized and modular implementation of GPT for educational and research purposes",
                language: "Jupyter Notebook",
                stars: 4,
                url: "https://github.com/Daivik1520/SAMgpt",
                updated: "Nov 2025",
                category: "AI/ML"
            },
            {
                name: "Face Recognition",
                description: "Real-time face recognition system for attendance and security applications",
                language: "Python",
                stars: 3,
                url: "https://github.com/Daivik1520/face-recognition",
                updated: "Nov 2025",
                category: "AI/ML"
            },
            {
                name: "SAM.CHAT",
                description: "Social media platform with AI-powered chat features and real-time communication",
                language: "TypeScript",
                stars: 2,
                url: "https://github.com/Daivik1520/SAM.CHAT",
                updated: "Nov 2025",
                category: "Web"
            },
            {
                name: "SAM Chatbot",
                description: "Clean Tkinter chatbot with offline factual Q&A and optional Wikipedia integration",
                language: "Python",
                stars: 3,
                url: "https://github.com/Daivik1520/SAMchatbot",
                updated: "Oct 2025",
                category: "AI/ML"
            },
            {
                name: "Heart Disease Recognition",
                description: "ML model with 95% accuracy comparing 8 algorithms for early heart disease detection",
                language: "Jupyter Notebook",
                stars: 2,
                url: "https://github.com/Daivik1520/Heart-disease-recognition",
                updated: "Oct 2025",
                category: "AI/ML"
            },
            {
                name: "Virtual Mouse",
                description: "Control your computer cursor with hand gestures - smooth, hands-free experience",
                language: "Python",
                stars: 2,
                url: "https://github.com/Daivik1520/virtual-mouse",
                updated: "Sep 2025",
                category: "AI/ML"
            },
            {
                name: "SAM v1",
                description: "First generation SAM - AI desktop assistant project that started it all",
                language: "Python",
                stars: 2,
                url: "https://github.com/Daivik1520/SAM",
                updated: "Sep 2025",
                category: "AI/ML"
            },
            {
                name: "GitHub Profile README",
                description: "My special GitHub profile repository with animated README",
                language: "Markdown",
                stars: 2,
                url: "https://github.com/Daivik1520/Daivik1520",
                updated: "Nov 2025",
                category: "Other"
            }
        ];

        function createProjectCard(project) {
            return `
                <div class="project-card" data-language="${project.language}" data-category="${project.category}">
                    <div class="project-header">
                        <div class="project-title">${project.name}</div>
                        <div class="project-stars">⭐ ${project.stars}</div>
                    </div>
                    <div class="project-description">${project.description}</div>
                    <div class="project-tech">
                        <span class="tech-badge">${project.language}</span>
                        <span class="tech-badge">${project.category}</span>
                    </div>
                    <div class="project-links">
                        <a href="${project.url}" target="_blank" class="project-link">View Code</a>
                    </div>
                    <div class="project-date">Updated: ${project.updated}</div>
                </div>
            `;
        }

        function renderProjects(filter = 'all', searchTerm = '') {
            const grid = document.getElementById('projectsGrid');
            let filtered = projects;

            if (filter !== 'all') {
                filtered = projects.filter(p => 
                    p.language === filter || p.category === filter
                );
            }

            if (searchTerm) {
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    p.description.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results">No projects found 🔍</div>';
            } else {
                grid.innerHTML = filtered.map(createProjectCard).join('');
            }
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderProjects(btn.dataset.filter, document.getElementById('searchBox').value);
            });
        });

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            renderProjects(activeFilter, e.target.value);
        });

        // Initial render
        renderProjects();
    </script>
</body>
</html>
