<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .fade-in { animation: fadeIn 1.2s ease forwards; }
      .slide-up { animation: slideUp 1s ease forwards; }
      .blink { animation: blink 1.2s step-end infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#1a7f37"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="800" height="2" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Avatar glow ring -->
  <circle cx="90" cy="90" r="60" fill="none" stroke="#0969da" stroke-width="1.5" opacity="0.4" class="pulse"/>

  <!-- Avatar circle -->
  <circle cx="90" cy="90" r="55" fill="#eaeef2"/>
  <text x="90" y="97" font-family="monospace" font-size="28" font-weight="700" fill="#0969da" text-anchor="middle">DR</text>

  <!-- Name -->
  <text x="170" y="68" font-family="monospace" font-size="22" font-weight="700" fill="#24292f" class="slide-up">daivik reddy</text>

  <!-- Role -->
  <text x="170" y="92" font-family="monospace" font-size="11.5" fill="#0969da" class="slide-up">ai architect  ·  systems builder  ·  founder @ DAV</text>

  <!-- Location/meta -->
  <text x="170" y="115" font-family="monospace" font-size="10.5" fill="#57606a" class="fade-in">hyderabad, india  ·  11th grade  ·  40+ github repos</text>

  <!-- Divider -->
  <line x1="40" y1="150" x2="760" y2="150" stroke="#d0d7de" stroke-width="1"/>

  <!-- About -->
  <text x="40" y="178" font-family="monospace" font-size="12" fill="#1a7f37" class="fade-in">// about</text>
  <text x="40" y="200" font-family="monospace" font-size="11.5" fill="#24292f">building AI systems at the edge of research and working product.</text>
  <text x="40" y="218" font-family="monospace" font-size="11.5" fill="#24292f">not wrappers. not demos. systems that ship.</text>

  <!-- Projects -->
  <text x="40" y="250" font-family="monospace" font-size="12" fill="#1a7f37" class="fade-in">// projects</text>
  <text x="40" y="271" font-family="monospace" font-size="11" fill="#0969da">&#9658; SAM-v4</text>
  <text x="148" y="271" font-family="monospace" font-size="11" fill="#57606a">&#8212; autonomous AI desktop assistant  [Python · LLM · TTS]</text>
  <text x="40" y="289" font-family="monospace" font-size="11" fill="#0969da">&#9658; facial_recognition</text>
  <text x="210" y="289" font-family="monospace" font-size="11" fill="#57606a">&#8212; real-time face attendance  [OpenCV · Python]</text>
  <text x="40" y="307" font-family="monospace" font-size="11" fill="#0969da">&#9658; virtual-mouse</text>
  <text x="176" y="307" font-family="monospace" font-size="11" fill="#57606a">&#8212; gesture-based PC control  [MediaPipe]</text>
  <text x="40" y="325" font-family="monospace" font-size="11" fill="#0969da">&#9658; DAV</text>
  <text x="98" y="325" font-family="monospace" font-size="11" fill="#57606a">&#8212; local-first AI: reasoning + memory + vision  [WIP]</text>
  <text x="40" y="343" font-family="monospace" font-size="11" fill="#0969da">&#9658; FitCore</text>
  <text x="128" y="343" font-family="monospace" font-size="11" fill="#57606a">&#8212; published fitness mobile app  [Flutter · Dart]</text>

  <!-- Divider -->
  <line x1="40" y1="360" x2="760" y2="360" stroke="#d0d7de" stroke-width="1"/>

  <!-- Stack -->
  <text x="40" y="382" font-family="monospace" font-size="12" fill="#1a7f37">// stack</text>

  <rect x="40" y="392" width="68" height="20" rx="4" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="74" y="406" font-family="monospace" font-size="10" fill="#0969da" text-anchor="middle">Python</text>
  <rect x="116" y="392" width="90" height="20" rx="4" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="161" y="406" font-family="monospace" font-size="10" fill="#0969da" text-anchor="middle">TypeScript</text>
  <rect x="214" y="392" width="72" height="20" rx="4" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="406" font-family="monospace" font-size="10" fill="#0969da" text-anchor="middle">Flutter</text>
  <rect x="294" y="392" width="72" height="20" rx="4" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="330" y="406" font-family="monospace" font-size="10" fill="#0969da" text-anchor="middle">PyTorch</text>
  <rect x="374" y="392" width="72" height="20" rx="4" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="410" y="406" font-family="monospace" font-size="10" fill="#0969da" text-anchor="middle">OpenCV</text>
  <rect x="454" y="392" width="68" height="20" rx="4" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="488" y="406" font-family="monospace" font-size="10" fill="#0969da" text-anchor="middle">Next.js</text>
  <rect x="530" y="392" width="68" height="20" rx="4" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="564" y="406" font-family="monospace" font-size="10" fill="#0969da" text-anchor="middle">Ollama</text>
  <rect x="606" y="392" width="60" height="20" rx="4" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="636" y="406" font-family="monospace" font-size="10" fill="#0969da" text-anchor="middle">React</text>
  <rect x="674" y="392" width="76" height="20" rx="4" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="406" font-family="monospace" font-size="10" fill="#0969da" text-anchor="middle">TensorFlow</text>

  <!-- Quote -->
  <text x="400" y="448" font-family="monospace" font-size="11" fill="#57606a" text-anchor="middle" font-style="italic">"code is the closest thing we have to thinking out loud at scale."</text>

  <!-- Cursor -->
  <text x="400" y="472" font-family="monospace" font-size="14" fill="#1a7f37" text-anchor="middle" class="blink">&#9646;</text>

  <!-- Bottom accent -->
  <rect x="0" y="498" width="800" height="2" fill="url(#accentGrad)" opacity="0.9"/>
</svg>